services:
  ocis:
    image: owncloud/ocis:${OCIS_DOCKER_TAG:-latest}
    entrypoint: ["/bin/sh"]
    # ocis init fails on later runs because the config exists; ignore that
    command: ["-c", "ocis init || true; exec ocis server"]
    environment:
      OCIS_URL: https://localhost:${OCIS_DEV_PORT:-9200}
      PROXY_TLS: "false"
      OCIS_INSECURE: "true"
      OCIS_LOG_LEVEL: info
      # shares the proxy's network namespace; nginx owns the public port, so oCIS' own
      # proxy binds an internal one (must match dev/nginx.conf.template)
      PROXY_HTTP_ADDR: 127.0.0.1:19200
      # auth-app: app tokens. Impersonation stays off.
      OCIS_ADD_RUN_SERVICES: auth-app
      PROXY_ENABLE_APP_AUTH: "true"
      AUTH_APP_ENABLE_IMPERSONATION: "false"
      # dev only: lets the spike create the first app token without an OIDC browser flow
      PROXY_ENABLE_BASIC_AUTH: "true"
      IDM_ADMIN_PASSWORD: admin
      IDM_CREATE_DEMO_USERS: "true"
    volumes:
      - ocis-config:/etc/ocis
      - ocis-data:/var/lib/ocis
      - ./frontend/dist:/var/lib/ocis/web/assets/apps/agent:ro
    network_mode: "service:proxy"
    depends_on:
      - proxy
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    environment:
      OCIS_DEV_PORT: ${OCIS_DEV_PORT:-9200}
    ports:
      - "${OCIS_DEV_PORT:-9200}:${OCIS_DEV_PORT:-9200}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./dev/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./dev/certs:/etc/nginx/certs:ro
    restart: unless-stopped

volumes:
  ocis-config:
  ocis-data:
